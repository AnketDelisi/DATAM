[project]
name = "flockvote"
version = "0.1.0"
description = "Agent-based election simulation and prediction (FlockVote)"
authors = [
    { name = "maple-zhou", email = "zhoulingfeng@sjtu.edu.cn" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["election", "simulation", "agent-based", "prediction", "FlockVote"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "openai>=1.0.0",
    "json-repair>=0.1.0",
    "omegaconf>=2.0.0",
    "pandas>=2.0.0",
    "wandb>=0.15.0",
    "openpyxl>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "flock.py",
  "data_loader.py",
  "utils.py",
  "config",
  "assets",
  "data",
]

[tool.hatch.build.targets.sdist]
include = [
  "flock.py",
  "data_loader.py",
  "utils.py",
  "config",
  "assets",
  "data",
  "README.md",
  "requirements.txt",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
strict = true

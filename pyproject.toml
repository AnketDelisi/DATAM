[project]
name = "datam"
version = "0.1.0"
description = "DATAM — Türkiye election poll aggregator, simulator, and demographic analysis"
authors = [
    { name = "maple-zhou", email = "zhoulingfeng@sjtu.edu.cn" }
]
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["election", "turkiye", "polling", "simulation", "demographics", "datam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
]
dependencies = [
    "pandas>=2.0.0",
    "PyYAML>=6.0",
    "omegaconf>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "html5lib>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
  "pipeline",
  "config",
  "web",
  "polls",
  "data",
  "README.md",
  "PLAN.md",
]

[tool.hatch.build.targets.sdist]
include = [
  "pipeline",
  "config",
  "web",
  "polls",
  "data",
  "README.md",
  "PLAN.md",
  "requirements.txt",
]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.9"
strict = true

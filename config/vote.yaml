year: 2024
candidate_Republican: Donald Trump
candidate_Democratic: Kamala Harris

# Experiment/run settings
use_wandb: False
wandb_project: 2024_Election
wandb_entity: FlockVote

# LLM call settings
model_name: qwen-max-2024-04-28
temperature: 0.7
max_retry: 20
request_timeout: 100
sleep_sec: 5

# Context settings
context_info_flag: True
context_info_title: Reimplemented

system_prompt: ""

prompt:
  template: default
  prefix: "# Profile\n"
  background: "In the {year} presidential election, {candidate_Republican} is the Republican candidate, and {candidate_Democratic} is the Democratic candidate."
  query: |
    
    # Requirement
    ONLY based on the profile and the information provided above, predict the probability that you would vote for each candidate as well as the probability that you would "vote for another candidate or not vote at all". Make sure the probabilities add up to 1.

    # Response Format
    Please output only the following JSON format, with no additional text.
    ```json
    {{
        "{candidate_Republican}": probability of voting for {candidate_Republican},
        "{candidate_Democratic}": probability of voting for {candidate_Democratic},
        "vote for another candidate or not vote at all": probability,
    }}
    ```
  fields:
    State:
      template: "- State: XXX\n"
      valmap: {}
    Race:
      template: "- Race: XXX\n"
      valmap: {}
    Sex:
      template: "- Sex: XXX\n" 
      valmap: {}
    Age:
      template: "- Age: XXX\n"
      valmap: {}
    Occupation:
      template: "- Occupation: XXX\n"
      valmap: {}
    Industry:
      template: "- Industry: XXX\n"
      valmap: {}
    Education:
      template: "- Educational Attainment: XXX\n"
      valmap: {}
    Religion:
      template: "- Religion: XXX\n"
      valmap: {}

name: Deploy DATAM

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: uv sync --python 3.12
      - run: uv run python -m unittest discover -s pipeline/tests -v
      - run: uv run python pipeline/export_site.py
      - run: uv run python pipeline/forecast_model.py
      - run: uv run python pipeline/province_swing.py
      - run: uv run python pipeline/district_swing.py
      - run: uv run python pipeline/demographic_correlation.py
      - run: uv run python pipeline/demographic_swing.py
      - run: uv run python pipeline/demographic_swing_backtest.py
      - run: uv run python pipeline/project_2028_seats.py

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test web/modules/*.test.js
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: node e2e/smoke.mjs
        working-directory: web

      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
